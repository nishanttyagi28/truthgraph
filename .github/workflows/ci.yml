name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (deterministic, no network)
        env:
          TRUTHGRAPH_SEMANTIC: "0"
          TRUTHGRAPH_HISTORY: "0"
        run: python -m pytest -v

      - name: Golden suite gate (lockfile)
        env:
          TRUTHGRAPH_SEMANTIC: "0"
        run: |
          python -m app.cli suite run examples/golden/suite.yaml
          python -m app.cli suite gate examples/golden/suite.yaml --lockfile examples/golden/suite.lock.json
